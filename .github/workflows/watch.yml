name: Odyssey 70mm CityWalk Watch

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "check_odyssey.py"
      - "test_check_odyssey.py"
      - "requirements.txt"
      - ".github/workflows/watch.yml"

permissions:
  contents: write

concurrency:
  group: odyssey-70mm-citywalk-watch
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh latest main state
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test date-only detection and retries
        run: python -m unittest -v

      - name: Check CityWalk showtime feed
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DAYS_AHEAD: "21"
          REQUEST_DELAY: "0.20"
        shell: bash
        run: |
          set +e
          python check_odyssey.py
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "Showtime-feed health warning logged; keeping workflow successful to avoid repeated failure emails."
            exit 0
          fi
          exit "$code"

      - name: Save monitor state
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "odyssey-ticket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Odyssey ticket monitor state"
          git pull --rebase origin main
          git push
