name: Odyssey 70mm CityWalk Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/watch.yml"

permissions:
  contents: write

concurrency:
  group: odyssey-70mm-citywalk-watch
  cancel-in-progress: false

jobs:
  test-notification:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send test phone notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          test -n "$NTFY_TOPIC"
          curl -fsS \
            -H "Title: Odyssey 70mm test" \
            -H "Priority: high" \
            -H "Tags: ticket" \
            -d "Test successful — your Odyssey IMAX 70mm phone notifications are connected." \
            "https://ntfy.sh/${NTFY_TOPIC}"

  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check AMC
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DAYS_AHEAD: "21"
        run: python check_odyssey.py

      - name: Save monitor state
        shell: bash
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "odyssey-ticket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update Odyssey ticket monitor state"
          git push
